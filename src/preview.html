<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="previewTitle">Page image</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header class="bar">
      <div class="titles">
        <p class="eyebrow" data-i18n="previewEyebrow">Full page</p>
        <h1 id="title" data-i18n="previewCapturing">Capturing</h1>
        <p id="source"></p>
      </div>
      <div class="actions" id="actions" hidden>
        <button id="copy" type="button" data-i18n="copyImage">Copy image</button>
        <a id="save" download data-i18n="download">Download</a>
      </div>
    </header>
    <p id="status" role="status"></p>
    <div id="notes"></div>
    <main id="sheets"></main>
    <script type="module" src="preview.js"></script>
  </body>
</html>
