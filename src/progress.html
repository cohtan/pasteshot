<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PasteShot</title>
    <link rel="stylesheet" href="progress.css" />
  </head>
  <body>
    <div class="top">
      <p class="eyebrow">PasteShot</p>
      <button id="settings" type="button" class="link" data-i18n="settings">Settings</button>
    </div>
    <h1 id="title" data-i18n="progStartTitle">Starting capture</h1>
    <ol class="steps" id="steps">
      <li id="step-start" data-i18n="stepStart">Start</li>
      <li id="step-scroll" data-i18n="stepScroll">Capture</li>
      <li id="step-copy" data-i18n="stepCopy">Copy</li>
    </ol>
    <p id="detail" role="status" data-i18n="progStartDetail">Leave the page as it is.</p>
    <div class="track" id="track" hidden>
      <div id="bar"></div>
    </div>
    <p id="note" hidden></p>
    <div class="actions" id="actions" hidden></div>
    <div class="actions" id="cancel-row" hidden>
      <button id="cancel" type="button" class="quiet" data-i18n="cancel">Cancel</button>
    </div>
    <script type="module" src="progress.js"></script>
  </body>
</html>
